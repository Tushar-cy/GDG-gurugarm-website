version: '3.8'

services:
  # --- 1. The NEW Frontend (React + Nginx) ---
  frontend:
    build:
      context: ./mainSite  # Looks in mainSite for its Dockerfile
    container_name: gdg-frontend
    restart: unless-stopped
    ports:
      - "80:80"  # Exposes the website on Port 80
    networks:
      - gdg-network
    depends_on:
      - app      # Waits for the backend to be ready

  # --- 2. The Backend (Java + Spring) ---
  app:
    build:
      context: .             # Looks in root for its Dockerfile
      dockerfile: Dockerfile # The one we fixed earlier
    container_name: gdg-app
    restart: unless-stopped
    ports:
      - "3001:3001" # Port for the backend itself
    depends_on:
      - postgres
      - minio
    networks:
      - gdg-network
    env_file:
      - .env

  # --- 3. The PostgreSQL Database ---
  postgres:
    image: postgres:15-alpine
    container_name: gdg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gdg-network

  # --- 4. The MinIO S3-Compatible Storage ---
  minio:
    image: minio/minio:latest
    container_name: gdg-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"  # MinIO S3 API
      - "9001:9001"  # MinIO Web Console
    volumes:
      - minio_data:/data
    networks:
      - gdg-network

volumes:
  postgres_data:
  minio_data:

networks:
  gdg-network:
    driver: bridge