version: '3.8'

services:
  # 1. The "God-Level" Spring Boot App
  app:
    build: .  # Tells Docker to build from your Dockerfile
    container_name: gdg-app
    restart: unless-stopped
    ports:
      - "3001:3001" # Exposes your app to the world
    depends_on:
      - postgres
      - minio
    networks:
      - gdg-network
    env_file:
      - .env # Loads all configuration from the .env file

  # 2. The PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: gdg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432" # Keep this internal, or bind to 127.0.0.1:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gdg-network

  # 3. The NEW MinIO S3-Compatible Storage
  minio:
    image: minio/minio:latest
    container_name: gdg-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"  # MinIO S3 API
      - "9001:9001"  # MinIO Web Console
    volumes:
      - minio_data:/data
    networks:
      - gdg-network

volumes:
  postgres_data:
  minio_data:

networks:
  gdg-network:
    driver: bridge